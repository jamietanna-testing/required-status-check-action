name: Frontend tests

on:
  push: {}

jobs:
  frontend-linter:
    runs-on: ubuntu-latest

    steps:
      - name: Run the linter
        run: |
          # pretend that we're doing work
          sleep 12

  frontend-build:
    runs-on: ubuntu-latest
    needs:
      - frontend-linter
      - frontend-tests

    steps:
      - name: Build app
        run: |
          # pretend that we're doing work
          sleep 2

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Run the tests
        run: |
          # pretend that we're doing work
          sleep 9
